<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/pages/sign.css">
        <link rel="stylesheet" href="../../style/icons.css">

        <title>User Configuration</title>
    </head>
    
    <body>
        
        <main>

            <section class="sign">
                
                <h1>Update</h1>
                
                <div class="icons">

                    <a href="store.html" class="image home">
                        <img src="../../assets/icons/not_hover/home.svg">
                    </a>
                    
                    <a href="purchase.html" class="image buy">
                        <img src="../../assets/icons/not_hover/purchase.svg">
                    </a>

                    <a href="filter.html" class="image filter">
                        <img src="../../assets/icons/not_hover/search.svg">
                    </a>

                    <a href="favorites.html" class="image favorites">
                        <img src="../../assets/icons/not_hover/star.svg">
                    </a>

                    <a href="insert_trip.html" class="image insert">
                        <img src="../../assets/icons/not_hover/insert_trip.svg">
                    </a>

                    <a href="user_configuration.html" class="image settings">
                        <img src="../../assets/icons/not_hover/configuration.svg">
                    </a>

                    <a href="../../index.html" class="image logout">
                        <img src="../../assets/icons/not_hover/logout.svg">
                    </a>
                </div>

                <form>

                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="username" required>

                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="email" required>

                    <label>Password</label>
                    <input type="password" id="password" name="password" placeholder="password" required>

                    <button type="submit">Submit</button>
                </form>
            </section>

            <section class="video">

                <video autoplay muted loop playsinline>
                    <source src="../../assets/videos/Moon_ocean.mp4" type="video/mp4">
                </video>
            </section>
        </main>
    </body>
</html>
