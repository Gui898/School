<!DOCTYPE html>

<html lang="en">
    
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/pages/insert_trip.css">

        <title>Insert Trip</title>
    </head>
    
    <body>
        
        <header>

            <div class="logo">

                <img src="../../assets/icons/favicon.jpg" alt="Logo">

                <h1>Create Trip</h1>
            </div>

            <nav>

                <a href="store.html" class="image home">
                    <img src="../../assets/icons/not_hover/home.svg">
                </a>
                
                <a href="purchase.html" class="image buy">
                    <img src="../../assets/icons/not_hover/purchase.svg">
                </a>

                <a href="filter.html" class="image filter">
                    <img src="../../assets/icons/not_hover/search.svg">
                </a>

                <a href="favorites.html" class="image favorites">
                    <img src="../../assets/icons/not_hover/star.svg">
                </a>

                <a href="insert_trip.html" class="image insert">
                    <img src="../../assets/icons/not_hover/insert_trip.svg">
                </a>

                <a href="user_configuration.html" class="image settings">
                    <img src="../../assets/icons/not_hover/configuration.svg">
                </a>

                <a href="../../index.html" class="image logout">
                    <img src="../../assets/icons/not_hover/logout.svg">
                </a>
            </nav>
        </header>

        <main>

            <h1>Insert a new Trip</h1>

            <form class="travel-form">

                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Osasco" required>
                </div>

                <div class="input-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" placeholder="$ 0,00" required>
                </div>

                <div class="input-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" name="date" placeholder="01/01/2000" required>
                </div>

                <div class="input-group">
                    <label for="duration">Duration</label>
                    <input type="text" id="duration" name="duration" placeholder="one week..." required>
                </div>

                <div class="input-group">
                    <label for="image_icon">Icon Image</label>
                    <input type="url" id="image_icon" name="image_icon" placeholder="https://...">
                </div>

                <div class="input-group">
                    <label for="image_background">Background Image</label>
                    <input type="url" id="image_background" name="image_background" placeholder="https://...">
                </div>

                <div class="input-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5" placeholder="Osasco is a great place to visit because..."></textarea>
                </div>

                <button type="submit">Insert Trip</button>
            </form>
        </main>

        <footer>
            
            <div class="footer_content">
                
                <p>Guilherme Henrique Gomes</p>                
                <p>Felipe Bianchi Stefens</p>
                <p>Class 3K</p>
                <p>Third Year</p>
                <p>Copyright © 2026 Guilherme and Felipe. All rights reserved.</p>
            </div>
        </footer>
    </body>
</html>
