<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/pages/filter.css">

        <title>Find Trip</title>
    </head>

    <body>
               
        <header>

            <div class="logo">

                <img src="../../assets/icons/favicon.jpg" alt="Logo">

                <h1>Search for Trips</h1>
            </div>

            <nav>

                <a href="store.html" class="image home">
                    <img src="../../assets/icons/not_hover/home.svg">
                </a>
                
                <a href="purchase.html" class="image buy">
                    <img src="../../assets/icons/not_hover/purchase.svg">
                </a>

                <a href="filter.html" class="image filter">
                    <img src="../../assets/icons/not_hover/search.svg">
                </a>

                <a href="favorites.html" class="image favorites">
                    <img src="../../assets/icons/not_hover/star.svg">
                </a>

                <a href="insert_trip.html" class="image insert">
                    <img src="../../assets/icons/not_hover/insert_trip.svg">
                </a>

                <a href="user_configuration.html" class="image settings">
                    <img src="../../assets/icons/not_hover/configuration.svg">
                </a>

                <a href="../../index.html" class="image logout">
                    <img src="../../assets/icons/not_hover/logout.svg">
                </a>
            </nav>
        </header>

        <main>

            <h1>Search Your Future Trip</h1>

            <div class="search-box">

                <div class="input-group">
                    <label for="search-name">Trip Name</label>
                    <input type="text" id="search-name" placeholder="Osasco">
                </div>

                <div class="input-group">
                    <label for="search-price">Maximum Price</label>
                    <input type="number" id="search-price" placeholder="$ 0">
                </div>

                <div class="input-group">
                    <label for="search-date">Date</label>
                    <input type="date" id="search-date" placeholder="01/01/2000">
                </div>
            </div>

            <div class="trips">

                <a href="trip.html" class="card">
                    <h2>Paris</h2>
                </a>

                <a href="trip.html" class="card">
                    <h2>Londres</h2>
                </a>

                <a href="trip.html" class="card">
                    <h2>Tóquio</h2>
                </a>

                <a href="trip.html" class="card">
                    <h2>Nova York</h2>
                </a>

                <a href="trip.html" class="card">
                    <h2>Roma</h2>
                </a>

                <a href="trip.html" class="card">
                    <h2>Rio de Janeiro</h2>
                </a>
            </div>
        </main>

        <footer>
            
            <div class="footer_content">
                
                <p>Guilherme Henrique Gomes</p>                
                <p>Felipe Bianchi Stefens</p>
                <p>Class 3K</p>
                <p>Third Year</p>
                <p>Copyright © 2026 Guilherme and Felipe. All rights reserved.</p>
            </div>
        </footer>

</html>
