<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/pages/sign.css">
        <script src="../../script/enter.js" defer></script>

        <title>Sign Up</title>
    </head>
    
    <body>
        
        <main>

            <section class="sign">
                
                <h1>Sign Up</h1>
                
                <form>

                    <label for="username">Username</label>
                    <input type="text" id="username_register" name="username" placeholder="username" required>

                    <label for="email">E-Mail</label>
                    <input type="email" id="email_register" name="email" placeholder="email" required>

                    <label>Password</label>
                    <input type="password" id="password_register" name="password" placeholder="password" required>

                    <button type="submit" onclick="validateRegister(event)">Submit</button>
                </form>

                <p>Already have an account? <a href="./sign_in.html">Login</a></p>
            </section>

            <section class="video">

                <video autoplay muted loop playsinline>
                    <source src="../../assets/videos/Moon_ocean.mp4" type="video/mp4">
                </video>
            </section>
        </main>
    </body>
</html>
