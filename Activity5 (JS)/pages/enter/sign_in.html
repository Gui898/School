<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/pages/sign.css">
        <script src="../../script/enter.js" defer></script>

        <title>Sign In</title>
    </head>
    
    <body>
        
        <main>

            <section class="sign">

                <h1>Sign In</h1>
                
                <form>

                    <label for="username">Username</label>
                    <input type="text" id="username_login" name="username" placeholder="username" required>

                    <label>Password</label>
                    <input type="password" id="password_login" name="password" placeholder="password" required>

                    <button class="submit" type="submit" onclick="login(event)">Submit</button>
                </form>
                
                <p>Don't have an account? <a href="./sign_up.html"> Register</a></p>
            </section>

            <section class="video">

                <video autoplay muted loop playsinline>
                    <source src="../../assets/videos/Snow_house.mp4" type="video/mp4">
                </video>
            </section>
        </main>
    </body>
</html>
